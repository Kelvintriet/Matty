<svg xmlns="http://www.w3.org/2000/svg" width="620" height="150" viewBox="0 0 620 150" role="img" aria-labelledby="title">
  <title id="title">Measured length 48 centimetres, actual length 50 centimetres</title>
  <rect width="620" height="150" rx="16" fill="#f6fbf3"/>
  <text x="24" y="47" font-family="Arial, sans-serif" font-size="18" fill="#49634d">Measured</text>
  <rect x="150" y="27" width="384" height="24" rx="12" fill="#6ecf46"/>
  <text x="545" y="46" font-family="Arial, sans-serif" font-size="16" fill="#49634d">48 cm</text>
  <text x="24" y="111" font-family="Arial, sans-serif" font-size="18" fill="#49634d">Actual</text>
  <rect x="150" y="91" width="400" height="24" rx="12" fill="#aecfb0"/>
  <text x="560" y="110" font-family="Arial, sans-serif" font-size="16" fill="#49634d">50 cm</text>
</svg>
